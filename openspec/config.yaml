schema: spec-driven

project_name: "farmaciaFinal"
version: "1.0.0"
description: "Sistema de Gestao de Farmacia com PDV, controle de estoque e motor de descontos"

context: |
  Project: Sistema de Gestão de Farmácia.
  Domain: Gestão de catálogo (Remédios, Bebidas, Fraldas, Higiene), registo de clientes (CPF), motor de desconto (15% para compras > R$ 100,00) e controlo de stock.
  Tech stack: Xano (Backend / XanoScript), Git, VS Code e OpenSpec.
  Architecture: Backend responsável pelas regras de negócio e validações. Pagamento apenas simulado no front-end.
  Development: Implementar mudanças de forma incremental utilizando a metodologia OpenSpec.
  Language: Escrever os artefatos OpenSpec em português do Brasil.

business_constants:
  discount_threshold_brl: 100.00
  discount_percentage: 0.15
  currency: "BRL"
  categories:
    - "Remédios"
    - "Bebidas"
    - "Fraldas"
    - "Produtos de Higiene"

rules_enforcement:
  require_cpf_for_discount: true
  validate_stock_before_sale: true
  mock_payment_gateway: true

githubCopilot:
  cloudAgent: true
